### This is an extremely minimal single-node Cassandra "cluster" for use in the spiffe-auth example.
### There are no best-practices here. This is just a quick and dirty way to get a Cassandra node up and running.

networks:
  spiffe-auth:

services:
  cassandra-1:
    image: cassandra:5
    container_name: cassandra-1
    ports:
      - "9042:9042"
    environment:
      - no_proxy=
      - http_proxy=
      - https_proxy=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_CLUSTER_NAME=demo
      - CASSANDRA_SNITCH=GossipingPropertyFileSnitch
      - HEAP_NEWSIZE=512M
      - MAX_HEAP_SIZE=4096M
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=localdev
    volumes:
      - cassandra-node-1:/var/lib/cassandra:rw
    restart:
      on-failure
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT now() FROM system.local'"]
      interval: 30s
      start_period: 2m
      timeout: 10s
      retries: 3

volumes:
  cassandra-node-1: