agent {
    data_dir = "/tmp/spire"
    log_level = "DEBUG"
    # Resolve the SPIRE Server through Docker Compose's internal DNS. This server_address might
    # need to be changed in some environments.
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/tmp/spire-agent/public/api.sock"
    insecure_bootstrap = true
    trust_domain = "demo.trust.geico"
}

plugins {
    NodeAttestor "join_token" {}

    KeyManager "memory" {
        plugin_data {
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }

    WorkloadAttestor "docker" {
        plugin_data {
        }
    }
}
