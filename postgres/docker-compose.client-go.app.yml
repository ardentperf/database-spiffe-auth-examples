### This runs a simple Go application that connects to Postgres via the client-side Envoy sidecar.
### The application is completely unaware of SPIFFE, Envoy, or mTLS — it simply connects to
### what it believes is a regular Postgres server at envoy-client:5432 with sslmode=disable.

networks:
  spiffe-auth:

services:
  app:
    build:
      # Build the Go application from the client-go directory.
      # To rebuild after changes: docker compose up --build app -f docker-compose.client-go.app.yml -f docker-compose.yml
      context: ./client-go
      dockerfile: Dockerfile
      tags:
        - postgres-spiffe-auth-app:latest
      target: app
    container_name: app
    restart:
      on-failure
    depends_on:
      - envoy-client
