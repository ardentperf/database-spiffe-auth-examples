# pg_hba.conf - SPIFFE JWT SVID authentication via PAM
#
# The Wasm filter rewrites the connecting username to the normalized SPIFFE ID
# path (e.g. "client_proxy") before the StartupMessage reaches Postgres.
# Postgres calls pam_exec -> verify-jwt.sh -> spire-agent api validate jwt
# to validate the JWT SVID passed as the password.
#
# TYPE  DATABASE  USER  ADDRESS      METHOD   OPTIONS
local   all       all                trust
host    all       all   0.0.0.0/0    pam      pamservice=postgres-spiffe
